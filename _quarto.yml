project:
  type: website
  output-dir: _site
  resources:
    - assets/fonts/*.ttf
    - assets/logos/*.png
    - to-confirm.csv
  pre-render:
    - tools/prerender.py
    - tools/check.py
  render:
    - "*.qmd"
    - "protocols/**/*.qmd"
    - "bench/*.qmd"
    - "workflows/*.qmd"

website:
  title: "EnGeL-UC Lab Protocols"
  site-url: "https://luiscunhamx.github.io/EnGeL-Repository/"
  repo-url: "https://github.com/luiscunhamx/EnGeL-Repository"
  repo-actions: [edit, issue]
  search: true
  navbar:
    logo: assets/logos/engel_mark.png
    left:
      - href: index.qmd
        text: Home
      - href: register.qmd
        text: Protocol register
      - href: people.qmd
        text: People
      - text: Workflows
        menu:
          - workflows/soil-fauna-metabarcoding.qmd
          - workflows/single-specimen-barcoding.qmd
          - workflows/rna.qmd
    right:
      - icon: github
        href: "https://github.com/luiscunhamx/EnGeL-Repository"
  sidebar:
    style: docked
    contents:
      # BEGIN sidebar (generated by tools/prerender.py from the protocols' short-title; do not edit by hand)
      - href: index.qmd
        text: Home
      - register.qmd
      - to-confirm.qmd
      - people.qmd
      - section: "Fauna sample processing"
        contents:
          - href: protocols/fauna/EnGeL-FAUNA-MAR-MORPH.qmd
            text: "Microarthropods: sampling, MacFadyen extraction, sorting"
      - section: "Molecular biology"
        contents:
          - href: protocols/molb/EnGeL-MOLB-DNA-MAG.qmd
            text: "DNA extraction, magnetic beads (InviGenius)"
          - href: protocols/molb/EnGeL-MOLB-DNA-COL.qmd
            text: "DNA extraction, spin columns (NZY Tissue)"
          - href: protocols/molb/EnGeL-MOLB-DNA-BARC.qmd
            text: "DNA extraction for barcoding (DNeasy)"
          - href: protocols/molb/EnGeL-MOLB-DNA-BEE.qmd
            text: "DNA from honey bee guts (NZY Soil)"
          - href: protocols/molb/EnGeL-MOLB-RNA.qmd
            text: "Total RNA extraction (TRIzol)"
          - href: protocols/molb/EnGeL-MOLB-NAQC.qmd
            text: "Nucleic acid QC (NanoDrop, Qubit, PicoGreen)"
          - href: protocols/molb/EnGeL-MOLB-MB.qmd
            text: "Metabarcoding library preparation (two-step PCR)"
          - href: protocols/molb/EnGeL-MOLB-KAPA.qmd
            text: "Library quantification, KAPA qPCR"
      - section: "Bioinformatics"
        contents:
          - href: protocols/bioinf/EnGeL-BIOINF-OBITOOLS4.qmd
            text: "Bioinformatics: OBITools4 pipeline"
      - section: "Workflows"
        contents:
          - workflows/soil-fauna-metabarcoding.qmd
          - workflows/sequencing-submission.qmd
          - workflows/rna.qmd
          - workflows/single-specimen-barcoding.qmd
      - section: "Bench sheets"
        contents:
          - href: bench/EnGeL-FAUNA-MAR-MORPH-bench.qmd
            text: "FAUNA-MAR-MORPH"
          - href: bench/EnGeL-MOLB-DNA-MAG-bench.qmd
            text: "MOLB-DNA-MAG"
          - href: bench/EnGeL-MOLB-DNA-COL-bench.qmd
            text: "MOLB-DNA-COL"
          - href: bench/EnGeL-MOLB-DNA-BARC-bench.qmd
            text: "MOLB-DNA-BARC"
          - href: bench/EnGeL-MOLB-DNA-BEE-bench.qmd
            text: "MOLB-DNA-BEE"
          - href: bench/EnGeL-MOLB-RNA-bench.qmd
            text: "MOLB-RNA"
          - href: bench/EnGeL-MOLB-NAQC-bench.qmd
            text: "MOLB-NAQC"
          - href: bench/EnGeL-MOLB-MB-bench.qmd
            text: "MOLB-MB"
          - href: bench/EnGeL-MOLB-KAPA-bench.qmd
            text: "MOLB-KAPA"
          - href: bench/EnGeL-BIOINF-OBITOOLS4-bench.qmd
            text: "BIOINF-OBITOOLS4"
      # END sidebar
  page-footer:
    left: "EnGeL-UC · Centre for Functional Ecology · University of Coimbra"
    right: "Text CC BY 4.0 · Code MIT"

lang: en-GB
filters:
  - path: tools/engel.lua
    at: pre-quarto

format:
  html:
    theme:
      light: [cosmo, assets/engel-fonts.scss, assets/engel.scss]
      dark: [darkly, assets/engel-fonts.scss, assets/engel-dark.scss]
    toc: true
    toc-depth: 2
    smooth-scroll: true

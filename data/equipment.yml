# Instruments shown on the Equipment page (handbook/equipment/index.qmd, generated by tools/prerender.py).
# `match`: regular expression searched in each protocol's `equipment:` list to find the protocols that use it.
# `log`: where use is recorded; `guide`: instrument procedure in the handbook (path from handbook/equipment/).
- name: InviGenius extraction robot (Invitek)
  match: "InviGenius"
  log: "[TO CONFIRM]"
- name: QuantStudio 3 qPCR instrument (Applied Biosystems)
  match: "QuantStudio"
  log: "PCR/qPCR user log"
- name: Thermocyclers (three new, one older; NextGenPCR)
  match: "Thermocycler"
  log: "PCR/qPCR user log; thermocycler weekly planner"
- name: TapeStation (Agilent)
  match: "TapeStation"
  log: "QC user log [TO CONFIRM]"
- name: NanoDrop spectrophotometer
  match: "NanoDrop"
  log: "QC user log; NanoDrop logbook"
- name: Qubit fluorometer
  match: "Qubit"
  log: "QC user log"
- name: FLUOstar Omega plate reader (BMG Labtech)
  match: "FLUOstar|plate reader"
  log: "QC user log [TO CONFIRM]"
- name: IR vacuum concentrator Micro-CenVac (N-Biotek)
  match: "concentrator"
  log: "[TO CONFIRM]"
- name: Bead-beating homogenisers (FastPrep-24 5G and others)
  match: "[Bb]ead-beating|homogeniser"
  log: "[TO CONFIRM]"
- name: Centrifuges and microcentrifuges
  match: "[Cc]entrifuge"
  log: "Centrifuge logbook"
- name: Gel electrophoresis and gel imaging
  match: "electrophoresis"
  log: "Electrophoresis logbook"
- name: MacFadyen high-gradient extractor
  match: "MacFadyen"
  log: "[TO CONFIRM]"
- name: Stereomicroscopes
  match: "Stereomicroscope"
  log: "[TO CONFIRM]"
- name: Bench autoclave Med 12 (Selecta)
  match: "autoclave"
  log: "Autoclave log"
  guide: EnGeL-GUIDE-AUTOCLAVE.qmd

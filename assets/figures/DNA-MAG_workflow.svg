<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="'Source Sans 3', 'Source Sans Pro', Arial, sans-serif" font-size="14" fill="#1E2420">
  <title>Magnetic-bead DNA extraction steps (InviGenius)</title>
  <desc>Lysis in tubes, transfer of lysate to the Bind plate, automated binding, three washes, drying and elution on the InviGenius robot.</desc>
  <rect width="960" height="330" fill="#ffffff"/>
  <defs><marker id="a3" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#074023"/></marker></defs>
  <text x="20" y="30" font-weight="700" font-size="16" fill="#074023">In tubes (manual)</text>
  <text x="400" y="30" font-weight="700" font-size="16" fill="#5753A4">On the InviGenius robot (programme M6399_IG96_v1, c. 45 min)</text>
  <rect x="390" y="42" width="555" height="250" rx="10" fill="#f1f0fa"/>
  <g font-size="13">
    <rect x="20" y="60" width="150" height="100" rx="8" fill="#074023"/>
    <text x="95" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">1 Lysis</text>
    <text x="95" y="104" text-anchor="middle" fill="#fff">250 µL TL Buffer</text>
    <text x="95" y="120" text-anchor="middle" fill="#fff">20 µL Proteinase K</text>
    <text x="95" y="136" text-anchor="middle" fill="#fff">55 °C, vortex</text>
    <path d="M172,110 L200,110" stroke="#074023" stroke-width="2" marker-end="url(#a3)"/>
    <rect x="205" y="60" width="160" height="100" rx="8" fill="#72BF44"/>
    <text x="285" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">2 Bind plate</text>
    <text x="285" y="104" text-anchor="middle" fill="#fff">spin 10 000 × g, 5 min</text>
    <text x="285" y="120" text-anchor="middle" fill="#fff">200 µL lysate</text>
    <text x="285" y="136" text-anchor="middle" fill="#fff">+ 230 µL AL Buffer</text>
    <path d="M367,110 L408,110" stroke="#074023" stroke-width="2" marker-end="url(#a3)"/>
    <text x="95" y="190" text-anchor="middle" font-size="12" fill="#5c6560">optional: archive</text>
    <text x="95" y="205" text-anchor="middle" font-size="12" fill="#5c6560">specimens in ethanol 96%</text>
    <path d="M95,162 L95,176" stroke="#9aa59e" stroke-width="1.5" marker-end="url(#a3)"/>
    <!-- robot steps -->
    <rect x="410" y="60" width="120" height="100" rx="8" fill="#5753A4"/>
    <text x="470" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">3 Bind</text>
    <text x="470" y="104" text-anchor="middle" fill="#fff">+ 340 µL binding</text>
    <text x="470" y="120" text-anchor="middle" fill="#fff">mix (HDQ beads)</text>
    <text x="470" y="136" text-anchor="middle" fill="#fff">mix 10 min</text>
    <path d="M532,110 L548,110" stroke="#074023" stroke-width="2" marker-end="url(#a3)"/>
    <rect x="552" y="60" width="140" height="100" rx="8" fill="#5753A4"/>
    <text x="622" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">4 Wash ×3</text>
    <text x="622" y="104" text-anchor="middle" fill="#fff">VHB1, VHB2, SPM</text>
    <text x="622" y="120" text-anchor="middle" fill="#fff">500 µL per well</text>
    <text x="622" y="136" text-anchor="middle" fill="#fff">2 min each</text>
    <path d="M694,110 L710,110" stroke="#074023" stroke-width="2" marker-end="url(#a3)"/>
    <rect x="714" y="60" width="100" height="100" rx="8" fill="#5753A4"/>
    <text x="764" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">5 Dry</text>
    <text x="764" y="112" text-anchor="middle" fill="#fff">beads</text>
    <text x="764" y="128" text-anchor="middle" fill="#fff">10 min</text>
    <path d="M816,110 L832,110" stroke="#074023" stroke-width="2" marker-end="url(#a3)"/>
    <rect x="836" y="60" width="100" height="100" rx="8" fill="#074023"/>
    <text x="886" y="84" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">6 Elute</text>
    <text x="886" y="104" text-anchor="middle" fill="#fff">50 µL</text>
    <text x="886" y="120" text-anchor="middle" fill="#fff">Elution Buffer</text>
    <text x="886" y="136" text-anchor="middle" fill="#fff">65 °C, 7 min</text>
    <!-- bead illustration -->
    <g transform="translate(430,190)">
      <text x="0" y="0" font-size="13" fill="#5753A4" font-weight="700">Principle</text>
      <circle cx="12" cy="30" r="9" fill="#5c6560"/><path d="M4,26 q8,-14 16,0" stroke="#72BF44" stroke-width="3" fill="none"/>
      <text x="30" y="35">DNA binds to the beads in the binding buffer;</text>
      <rect x="4" y="52" width="16" height="16" fill="#1E2420"/>
      <text x="30" y="65">magnetic rods carry the beads from plate to plate;</text>
      <circle cx="12" cy="88" r="9" fill="#5c6560"/>
      <text x="30" y="93">clean DNA is released into the elution plate.</text>
    </g>
  </g>
  <text x="20" y="320" font-size="12" fill="#5c6560">Schematic. Volumes from EnGeL-MOLB-DNA-MAG, Procedure; lysis time still to be confirmed in the protocol.</text>
</svg>
